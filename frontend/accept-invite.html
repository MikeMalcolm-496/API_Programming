<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accept Invitation - Lost &amp; Found</title>
    <meta name="api-base" content="https://api-programming.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand"><a href="index.html">Lost &amp; Found</a></div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Browse Items</a></li>
                <li><a href="info.html">Contact &amp; Info</a></li>
            </ul>
        </div>
    </nav>
    <main class="container auth-container">
        <div class="auth-card">
            <h2>Accept your invitation</h2>
            <p class="auth-subtitle">Choose a password to activate your account.</p>
            <form id="acceptInviteForm" class="auth-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" minlength="8" autocomplete="new-password" required />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required />
                </div>
                <div id="inviteError" class="error-message" role="alert" hidden></div>
                <div id="inviteSuccess" class="success-message" role="status" hidden></div>
                <button type="submit" class="btn btn-primary btn-block">Set password and activate</button>
            </form>
            <p class="auth-footer"><a href="login.html">Return to login</a></p>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 Strathmore University - Lost &amp; Found Platform</p></footer>
    <script src="js/session.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
