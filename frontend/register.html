<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Lost &amp; Found</title>
    <meta name="api-base" content="https://api-programming.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html">Lost &amp; Found</a>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Browse Items</a></li>
                <li><a href="info.html">Contact &amp; Info</a></li>
            </ul>
        </div>
    </nav>

    <main class="container auth-container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join the Strathmore Lost &amp; Found community</p>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password (min 8 characters)" required minlength="8" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                </div>
                <div class="form-group">
                    <label for="studentId">Student ID (Optional)</label>
                    <input type="text" id="studentId" placeholder="e.g., 123456" />
                    <small class="form-hint">Only required if you are a student</small>
                </div>
                <div class="form-group" id="strathbitesGroup">
                    <label for="strathbitesUserId">Strathbites User ID (Optional)</label>
                    <input type="number" id="strathbitesUserId" min="1" step="1" placeholder="e.g., 3" />
                    <small class="form-hint">Lets security confirm a claim using your cafeteria orders</small>
                </div>
                <div class="form-group">
                    <label for="role">Register As</label>
                    <select id="role" required>
                        <option value="student">Student</option>
                        <option value="security">Security Staff</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group" id="staffCodeGroup" hidden>
                    <label for="staffCode">Staff Sign-up Code</label>
                    <input type="password" id="staffCode" placeholder="Provided by the administrator" autocomplete="off" />
                </div>
                <div id="registerError" class="error-message" role="alert" hidden></div>
                <div id="registerSuccess" class="success-message" role="status" hidden></div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strathmore University - Lost &amp; Found Platform</p>
    </footer>
    <script src="js/session.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
